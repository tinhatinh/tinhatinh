name: Generate Hacker Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate Red-Team Matrix Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-hacker.svg?color_snake=#ff2a6d&color_dots=#0d1117,#0a3622,#0f6b3e,#00b84c,#00ff41
            dist/github-snake-light.svg?color_snake=#ff2a6d&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39

      - name: Deploy Snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
